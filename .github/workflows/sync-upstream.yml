name: Sync fork from upstream

# Keeps bit1001/Reloc in sync with Reukix/Reloc every 2 hours.
# Uses a merge (not reset/force-push) so this fork's own workflow commit on
# main is preserved. If a real conflict occurs, the job aborts safely and
# reports it instead of overwriting either side.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Reukix/Reloc.git
          git fetch upstream --prune --tags

      - name: Merge upstream into main
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          UP=refs/remotes/upstream/main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "$UP")" ]; then
            echo "Already up to date with upstream ($(git rev-parse --short HEAD))."
            echo "RESULT=up-to-date" >> "$GITHUB_ENV"
            exit 0
          fi
          OLD=$(git rev-parse --short HEAD)
          if git merge --no-edit "$UP"; then
            git push origin main
            NEW=$(git rev-parse --short HEAD)
            echo "Merged upstream into main: $OLD -> $NEW"
            echo "RESULT=updated" >> "$GITHUB_ENV"
          else
            git merge --abort || true
            echo "::warning::Merge conflict while syncing upstream; fork left untouched."
            echo "RESULT=conflict" >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Sync tags
        if: env.RESULT != 'conflict'
        run: |
          set -e
          git fetch upstream --tags --force
          git push origin --tags

      - name: Summary
        if: always()
        run: |
          echo "### Upstream sync: ${{ env.RESULT || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: https://github.com/Reukix/Reloc" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork HEAD: $(git rev-parse --short HEAD 2>/dev/null)" >> "$GITHUB_STEP_SUMMARY"
